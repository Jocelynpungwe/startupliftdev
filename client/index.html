<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="StartupLift Dev is a modern web development and digital solutions company focused on helping businesses build a stronger presence online"
    />
    <meta
      name="google-site-verification"
      content="QHxDZYOTrk4xdDFEdaXmOnwx9-Yk6rXuEQbM0Mjg8cw"
    />
    <link rel="icon" type="image/png" href="/logo-mark.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap"
    />
    <meta name="theme-color" content="#0a0908" />
    <title>StartupLift Dev</title>
    <style>
      /* shown while the app downloads; React replaces it as soon as it mounts */
      html,
      body {
        margin: 0;
        background: #0a0908;
      }
      .boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: radial-gradient(
            ellipse 55% 45% at 50% 48%,
            rgba(201, 169, 106, 0.14),
            transparent 70%
          ),
          #0a0908;
        color: #f4efe6;
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 28px;
        letter-spacing: -0.01em;
      }
      .boot em {
        font-style: italic;
        color: #c9a96a;
      }
      .boot i {
        display: block;
        width: 170px;
        height: 1px;
        overflow: hidden;
        background: rgba(201, 169, 106, 0.2);
      }
      .boot i::after {
        content: '';
        display: block;
        width: 45%;
        height: 100%;
        background: linear-gradient(90deg, transparent, #e3c88f, transparent);
        animation: boot-slide 1.4s ease-in-out infinite;
      }
      @keyframes boot-slide {
        0% {
          transform: translateX(-120%);
        }
        60%,
        100% {
          transform: translateX(260%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot i::after {
          animation: none;
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-label="Loading">
        <span>StartupLift <em>Dev</em></span>
        <i></i>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
